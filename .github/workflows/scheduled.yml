name: Schedule Jobs

on:
  workflow_dispatch:
    inputs:
      REPO_NAMES:
        required: false
        description: comma separated list of repo names within bcgov org. for one of jobs to run for specific repos.
  schedule: # * is a special character in YAML, so you have to quote this string, every day at 4PM PST as 5PM the powerbi refresh happens.
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  pubcode-crawler:
    name: Crawl Git Repos for bcgovpubcode.yml
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    environment: prod
    defaults:
      run:
        working-directory: crawler
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Add Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Process script
        uses: bcgov/actions-openshift/oc-runner@4dbe4f6d25d14cbdb01e525a302e61e31f96c3ed # v0.5.0
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAMES: ${{ github.event.inputs.REPO_NAMES }}
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          timeout: 40m
          commands: |
            cd crawler
            npm ci
            API_KEY=$(oc get secrets/pubcode --template='{{.data.API_KEY}}' | base64 -d)
            API_URL=https://$(oc get ingress/pubcode-api --template='{{(index .spec.rules 0).host}}')
            API_KEY="${API_KEY}" API_URL="${API_URL}" node src/main.js

  validate-ministry-list:
    name: Validate Ministry List in the pubcode schema.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: schema/script
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Add Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"

      - name: Install Dependencies
        run: npm ci

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Process script
        id: validate-ministry-list
        run: node ./index.js

      - name: Open a pull request with the new ministry names
        if: steps.validate-ministry-list.outputs.schemaChanged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "fix(schema): update ministry names from gov.bc.ca"
        run: |
          set -euo pipefail
          if [ -n "$(gh pr list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[].number')" ]; then
            echo "A ministry name pull request is already open"
            exit 0
          fi
          BRANCH="chore/ministry-names-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add ../bcgovpubcode.json
          git commit -m "${TITLE}"
          git push origin "${BRANCH}"
          gh pr create --assignee DerekRoberts --base main --head "${BRANCH}" --label chore --title "${TITLE}" \
            --body "The ministry names in the schema no longer match https://www2.gov.bc.ca/gov/content/governments/organizational-structure/ministries-organizations/ministries."

  soft-delete-removed-pubcodes:
    name: Soft Delete pubcodes In the Databse which are removed from the repo.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: utilities/remove-deleted-pubcode
    environment: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Add Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Process script
        uses: bcgov/actions-openshift/oc-runner@4dbe4f6d25d14cbdb01e525a302e61e31f96c3ed # v0.5.0
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.OC_TOKEN }}
          commands: |
            cd utilities/remove-deleted-pubcode
            npm ci
            API_KEY=$(oc get secrets/pubcode --template='{{.data.API_KEY}}' | base64 -d)
            API_URL=https://$(oc get ingress/pubcode-api --template='{{(index .spec.rules 0).host}}')
            API_KEY="${API_KEY}" API_URL="${API_URL}" node index.js
