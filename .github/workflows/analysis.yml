name: Analysis

on:
  push:
    branches: [main]
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "0 12 * * 0" # 3 AM PST = 12 PM UDT, runs sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,config"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  api-tests:
    name: API Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      mongo:
        image: ghcr.io/bcgov/nr-containers/mongo:7.0.43
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/pubcode-test

  unit-tests:
    name: Unit Tests (${{ matrix.dir }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir: [crawler, schema/script, utilities/remove-deleted-pubcode]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm test

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run lint

  # Catches broken workflows on the PR, including those that only run after merge or on a schedule
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  # This job is the merge gate for this workflow. Every job in this
  # workflow must be listed in 'needs', or its failure won't block the PR.
  results:
    name: Analysis Results
    needs: [trivy, api-tests, unit-tests, frontend-lint, workflow-lint]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one required job failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "All required jobs passed or were intentionally skipped."
