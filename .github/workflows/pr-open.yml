name: Pull Request

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  builds:
    name: Builds
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      attestations: write
      id-token: write
      packages: write
    strategy:
      matrix:
        package: [api, database, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: bcgov/actions/builder@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number || github.sha }}
          tag_fallback: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ github.event.number || github.sha }}
          tags: ${{ github.sha }}

  deploys:
    name: Deploys
    needs: [builds]
    permissions:
      contents: read
    uses: ./.github/workflows/.deploy.yml
    secrets: inherit
    with:
      autoscaling: false
      tag: ${{ github.event.number }}
      release_name: pubcode-${{ github.event.number }}
      params: |
        --set-string global.repository=${{ github.repository }}  \
        --set-string database.containers[0].tag="${{ github.sha }}" \
        --set-string database.initContainers[0].tag="${{ github.sha }}" \
        --set-string api.containers[0].tag="${{ github.sha }}" \
        --set-string api.containers[0].resources.requests.cpu="30m" \
        --set-string api.containers[0].resources.requests.memory="50Mi" \
        --set-string frontend.containers[0].tag="${{ github.sha }}" \
        --set-string frontend.containers[0].resources.requests.cpu="30m" \
        --set-string frontend.containers[0].resources.requests.memory="50Mi" \
        --set-string database.containers[0].resources.requests.cpu="30m" \
        --set-string database.containers[0].resources.requests.memory="50Mi" \
        --set-string database.initContainers[0].resources.requests.cpu="30m" \
        --set-string database.initContainers[0].resources.requests.memory="50Mi" \
        --set-string database.pvc.size="350Mi" \
        --set-string global.env.VITE_SCHEMA_BRANCH=${{ github.event.pull_request.head.ref }} \

  tests:
    name: Tests
    needs: [deploys]
    permissions:
      contents: read
    uses: ./.github/workflows/.tests.yml
    with:
      target: ${{ github.event.number }}

  compose:
    name: Docker Compose
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      # docker-compose.yml serves frontend/dist from the host
      - name: Build frontend
        working-directory: frontend
        run: npm ci --ignore-scripts && npm run build

      - name: Start stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 http://localhost:3005/api/pub-code/health
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 http://localhost:3002/ | grep -q '<div id="root">'
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 http://localhost:3002/api/pub-code/health
          # mongo-express may answer 401 (basic auth); anything below 500 means it's up
          code=$(curl -sS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null -w '%{http_code}' http://localhost:8001/)
          echo "mongo-express: HTTP ${code}"
          [ "${code}" -lt 500 ]

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # This job is the merge gate for this workflow. Every job in this
  # workflow must be listed in 'needs', or its failure won't block the PR.
  results:
    name: PR Results
    needs: [builds, compose, deploys, tests]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Log Job Results Context
        run: |
          echo "=== Upstream Job Statuses ==="
          echo '${{ toJson(needs) }}'

      - name: Evaluate Overall Status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one required job failed or was cancelled."
          exit 1

      - name: Success Message
        run: echo "All required jobs passed or were intentionally skipped."
